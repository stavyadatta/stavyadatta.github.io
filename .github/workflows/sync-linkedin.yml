name: Sync LinkedIn activity

on:
  schedule:
    - cron: '17 2 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-linkedin:
    if: ${{ secrets.LINKEDIN_ACCESS_TOKEN != '' && secrets.LINKEDIN_MEMBER_URN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch posts from LinkedIn Posts API
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_URN: ${{ secrets.LINKEDIN_MEMBER_URN }}
          LINKEDIN_VERSION: '202601'
        run: python3 scripts/linkedin_sync.py --output data/linkedin_posts.json
      - name: Commit feed if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/linkedin_posts.json
          git diff --cached --quiet || git commit -m 'chore: sync LinkedIn activity'
          git push
